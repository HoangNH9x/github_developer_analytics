name: Inspect Power BI report structure

on:
  push:
    branches:
      - inspect-powerbi-final
    paths:
      - "_review/inspect_pbix.py"
      - ".github/workflows/inspect-pbix.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect PBIX page and visual metadata
        run: python _review/inspect_pbix.py
