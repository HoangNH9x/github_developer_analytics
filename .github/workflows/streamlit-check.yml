name: Validate Streamlit dashboard

on:
  push:
    branches:
      - streamlit-final-dashboard
    paths:
      - "streamlit_app.py"
      - "data/processed/repository_summary.csv"
      - "data/processed/repository_summary_audit.csv"
      - ".github/workflows/streamlit-check.yml"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile app
        run: python -m py_compile streamlit_app.py

      - name: Validate repository summary
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("data/processed/repository_summary.csv")
          with path.open("r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          assert len(rows) == 952, f"Expected 952 repository rows, found {len(rows)}"
          ids = [row["repo_id"] for row in rows]
          assert len(set(ids)) == len(ids), "repo_id is not unique"
          expected = {
              "commits_observed_count": 21646,
              "issues_observed_count": 119622,
              "pull_requests_observed_count": 222876,
          }
          for column, total in expected.items():
              actual = sum(int(row[column] or 0) for row in rows)
              assert actual == total, f"{column}: expected {total}, found {actual}"
          print(f"Validated {len(rows)} unique repositories and activity totals.")
          PY
