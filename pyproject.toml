[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-developer-analytics-rebuild"
version = "0.1.0"
description = "Repository-centric GitHub activity analytics pipeline for a student project"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3.0",
  "pandas>=2.0,<4.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
